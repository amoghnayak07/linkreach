# linkreach configuration. Every field is validated at startup.

# Connection requests: you send them yourself by default. `manual` hides and blocks
# the `send` and `sync` commands. `automated` turns the old automated send path back
# on (it's dormant and not kept up to date; see docs/adr/0001).
connect_mode: manual     # manual | automated

# Hard caps. You may lower these; values above 40 / 20 / 80 are rejected.
caps:
  daily_views: 40        # profile + search page loads per local day
  daily_requests: 20     # connection requests per local day
  weekly_requests: 80    # connection requests per rolling 7 days

# `linkreach job`: how many Picks a Job aims for. Profile links you paste always count and
# are never cut; linkreach searches LinkedIn only to fill the slots left. Override per run
# with `linkreach job --picks N`.
pick_target: 5

delay:                   # random wait between page loads (minimum 8 s)
  min_seconds: 8
  max_seconds: 25

# Alumni of this school rank first within a tier when `job` searches for Picks, and
# drafts mention the shared school.
alumni_school: Northeastern

background: |
  Naveen Murali
  - Product Manager with 3+ years shipping AI-powered enterprise SaaS and ERP platforms
  - Bizom: owned an AI-enabled ERP/SaaS platform across 15+ clients including Godrej
    and Castrol, drove $10M+ revenue; shipped an AI image-recognition module that
    lifted conversion by 25%
  - Vestmark (TPM Co-op): consolidated 40+ legacy reporting systems into 8 workflows,
    cut decision latency by 70%; built a Python + LLM tool that cut reporting time
    from hours to minutes
  - M.S. Engineering Management, Northeastern University, graduating December 2026
  - U.S. work authorization through OPT, no sponsorship needed (change in status
    ahead of naturalization in 2027)
  - Builds independent AI projects (RAG/LangChain agents, credit risk models with
    SHAP/XGBoost)

# Email drafts link to this instead of attaching a file.
resume_url: https://example.com/naveen-murali-resume.pdf   # CHANGE ME

banned_phrases: [synergy, leverage, passionate about disrupting, circle back, i hope this finds you well]

model: claude-sonnet-5-5

# How linkreach reaches Claude:
#   api          the Anthropic API with your own API key (`linkreach set-key` or .env)
#   claude_code  the Claude Code CLI installed on this computer (`claude -p`), signed in
#                with your own Claude account. No API key needed: use this on a Claude
#                Pro/Max/Team/Enterprise plan without API access. Calls count against your
#                plan's usage limits; on a Team/Enterprise seat, check that your organization
#                allows scripted and personal use first. Run `claude` once and sign in.
llm_backend: api              # api | claude_code
claude_code_path: claude      # claude_code only: name on PATH, or a full path such as
                              # C:/Users/you/.local/bin/claude.exe
claude_code_timeout_seconds: 120   # claude_code only: give up on one call after this long

# API-only (ignored with claude_code, as is prompt caching):
use_refusal_fallbacks: true   # server-side fallback if the model declines a request

note_max_chars: 200           # connection note limit: 200 on a free LinkedIn account, 300 with Premium

# These three only matter with connect_mode: automated (the dormant send/sync path).
follow_up_delay_days: 5   # sync sets a follow-up date this many days after acceptance

brake:
  min_sample: 30     # requests older than age_days before the brake can trip
  min_rate: 0.25     # trips below this acceptance rate
  age_days: 7

auto_window:         # send --auto only runs inside this window (local time)
  days: [mon, tue, wed, thu, fri]
  start: "09:00"
  end: "18:00"

# Dedicated profile, used for LinkedIn only. Your everyday Chrome profile is refused.
chrome_profile_dir: ~/.linkreach/chrome-profile
chrome_channel: chrome     # use installed Google Chrome
headless: false

# A public profile that `doctor` loads to check selectors. Pick one with an About section.
doctor_profile_url: https://www.linkedin.com/in/williamhgates/   # CHANGE ME if you like

# How emails and connection notes should sound lives in style.md (the Style file),
# next to this file. `linkreach init` creates it from the example.
